<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>{{ title or "Travis Miller - Design Systems Designer | Apple, Google, Leia" }}</title>
  <meta name="title" content="{{ title or 'Travis Miller - Design Systems Designer' }}" />
  <meta name="description" content="{{ description or 'Design systems designer with 11 years building scalable design infrastructure for Apple, Google, and Leia. Combining systems thinking, visual craft, and technical implementation (HTML/CSS/JS) to create strategic, beautiful, and adoptable design systems.' }}" />
  <meta name="keywords" content="design systems designer, design infrastructure, scalable design, component design, design systems architecture, visual design, motion design, HTML CSS JavaScript, WCAG accessibility, cross-functional design, design documentation, design systems strategy, product design, Bay Area designer, Silicon Valley designer, senior designer, staff designer" />
  <meta name="author" content="Travis Miller" />
  <link rel="canonical" href="https://travismillerdesign.com{{ page.url or '/' }}" />
  
  <!-- Additional SEO -->
  <meta name="robots" content="index, follow" />
  <meta name="language" content="English" />
  <meta name="revisit-after" content="7 days" />
  
  <!-- Geo Tags (Bay Area focus) -->
  <meta name="geo.region" content="US-CA" />
  <meta name="geo.placename" content="Bay Area, California" />
  <meta name="geo.position" content="37.3861;-122.0839" />
  <meta name="ICBM" content="37.3861, -122.0839" />
  
  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  
  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "Person",
    "name": "Travis Miller",
    "jobTitle": "Design Systems Designer",
    "description": "Design systems designer with 11 years building scalable design infrastructure",
    "url": "https://travismillerdesign.com",
    "sameAs": [
      "https://www.linkedin.com/in/travismillerdesign/"
    ],
    "knowsAbout": [
      "Design Systems",
      "Component Design",
      "Visual Design",
      "Motion Design",
      "HTML/CSS/JavaScript",
      "Accessibility (WCAG)",
      "Figma",
      "Design Infrastructure"
    ],
    "address": {
      "@type": "PostalAddress",
      "addressRegion": "CA",
      "addressLocality": "Bay Area"
    }
  }
  </script>
  
  <link rel="stylesheet" href="/styles/project.css" />
</head>
<body>

  <main>{{ content | safe }}</main>

  {% include 'footer.html' %}

  <script src="/scripts/scroll-animations.js"></script>
  <script src="/scripts/page-transitions.js"></script>

  <!-- P5.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

  <!-- P5.js Mobile Optimizer - Must load before case study animations -->
  <script src="/scripts/p5-mobile-optimizer.js"></script>

  <!-- Case Study Animations -->
  <script src="/scripts/case-study-animations.js"></script>

  <!-- Keyboard Navigation -->
  <script src="/scripts/case-study-navigation.js"></script>
</body>
</html>
